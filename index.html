<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:10px;padding-bottom:40px}
.wallet{background:linear-gradient(45deg,#FF9800,#F44336);color:#fff;padding:15px;border-radius:12px;font-size:20px;position:sticky;top:0;z-index:10}
.box{background:#fff;padding:12px;border-radius:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{background:#fff;padding:15px;border-radius:12px;border:2px solid #eee;text-align:center}
.btn{border:none;padding:10px 15px;border-radius:8px;font-weight:bold;cursor:pointer;color:#fff;background:#FF9800}
#modal{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:999}
.modalBox{background:#fff;width:90%;max-width:350px;padding:20px;border-radius:15px;text-align:center}
input{width:90%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ccc}
</style></head><body>
<div class="wallet">Wallet: ₹<span id="wallet">21</span></div>

<div class="box" style="display:flex; justify-content:space-around;">
<button class="btn" style="background:green" onclick="openDeposit()">ADD CASH</button>
<button class="btn" style="background:#2196F3" onclick="openWithdraw()">WITHDRAW</button>
</div>

<div class="box" style="background:#4CAF50;color:white;">
<b>👫 REFER & EARN</b><br>
Your Code: <b id="myRefCode" style="background:white;color:green;padding:3px 6px;border-radius:5px;"></b><br><br>
<button class="btn" style="background:white;color:green" onclick="shareRefer()">SHARE</button><br><br>
<input id="enterRefCode" placeholder="Refer Code"><br>
<button class="btn" onclick="applyRefCode()">GET ₹100</button>
<p>Owner Earn: ₹<span id="ownerEarn">0</span></p>
</div>

<div class="grid">
<div class="game"><b>SPIN</b><br><button class="btn" onclick="playSpin()">PLAY</button></div>
<div class="game"><b>SCRATCH</b><br><button class="btn" onclick="playScratch()">PLAY</button></div>
<div class="game"><b>GUESS</b><br><button class="btn" onclick="playGuess()">PLAY</button></div>
<div class="game"><b>TAP</b><br><button class="btn" onclick="playTap()">PLAY</button></div>
<div class="game"><b>MATH</b><br><button class="btn" onclick="playMath()">PLAY</button></div>
<div class="game"><b>DICE</b><br><button class="btn" onclick="playDice()">PLAY</button></div>
<div class="game" style="grid-column:span 2;background:gold"><b>MEMORY - ₹15</b><br><button class="btn" style="background:green" onclick="playMemory()">PLAY</button></div>
</div>

<div id="modal"><div class="modalBox"><div style="text-align:right"><span onclick="closeM()" style="font-size:25px;cursor:pointer;">X</span></div><div id="mContent"></div></div></div>

<script>
let MY_UPI="9740384015@ybl"; let MY_NAME="Prajwal"; let WA="919740384015";
let wallet=parseInt(localStorage.getItem("my_wallet")||"21");
let ownerEarn=parseInt(localStorage.getItem("owner_earn")||"0");
document.getElementById("wallet").innerText=wallet;
document.getElementById("ownerEarn").innerText=ownerEarn;
function save(){localStorage.setItem("my_wallet",wallet);document.getElementById("wallet").innerText=wallet;}
function openM(){document.getElementById("modal").style.display="flex";}
function closeM(){document.getElementById("modal").style.display="none";}
function addMoney(a,t){wallet+=a;save();alert("₹"+a+" "+t+" Won!");closeM();}

// REFER
let myCode=localStorage.getItem("my_ref_code"); if(!myCode){myCode="REF"+Math.floor(1000+Math.random()*9000);localStorage.setItem("my_ref_code",myCode);} document.getElementById("myRefCode").innerText=myCode;
function shareRefer(){let l=location.href.split('?')[0]+"?ref="+myCode; window.open("https://wa.me/?text="+encodeURIComponent("App ನಲ್ಲಿ ₹100 FREE! Code: "+myCode+" Link: "+l));}
function applyRefCode(){let c=document.getElementById("enterRefCode").value.trim().toUpperCase(); if(!c)return alert("Code ಹಾಕಿ"); if(localStorage.getItem("ref_used"))return alert("Already Used"); if(c==myCode)return alert("Own Code ಆಗಲ್ಲ"); wallet+=100; save(); ownerEarn+=150; localStorage.setItem("owner_earn",ownerEarn); document.getElementById("ownerEarn").innerText=ownerEarn; localStorage.setItem("ref_used",c); alert("₹100 Added!"); closeM();}

function openDeposit(){document.getElementById("mContent").innerHTML='<h3>ADD CASH</h3><input type="number" id="dep" placeholder="Min 10"><br><button class="btn" style="background:green" onclick="goDep()">PAY</button>'; openM();}
function goDep(){let a=document.getElementById("dep").value; if(a<10)return alert("Min 10"); location.href="upi://pay?pa="+MY_UPI+"&pn="+MY_NAME+"&am="+a+"&cu=INR";}

function openWithdraw(){document.getElementById("mContent").innerHTML='<h3>WITHDRAW 10% Fee</h3><p>Wallet ₹'+wallet+'</p><input type="number" id="wam" placeholder="Min 50"><input type="text" id="upi" placeholder="Your UPI"><br><button class="btn" style="background:#2196F3" onclick="goWith()">WITHDRAW</button>'; openM();}
function goWith(){let a=parseInt(document.getElementById("wam").value); let u=document.getElementById("upi").value; if(a<50)return alert("Min 50"); if(a>wallet)return alert("No Balance"); if(!u)return alert("UPI ಹಾಕಿ"); let fee=Math.round(a*0.1); let get=a-fee; wallet-=a; save(); ownerEarn+=fee; localStorage.setItem("owner_earn",ownerEarn); document.getElementById("ownerEarn").innerText=ownerEarn; window.open("https://wa.me/"+WA+"?text=Withdraw ₹"+a+" UPI:"+u+" UserGet ₹"+get); alert("Withdraw Success! You get ₹"+get); closeM();}

// GAMES - FIXED
function playSpin(){let r=Math.floor(Math.random()*10); let win=r>5?5:0; document.getElementById("mContent").innerHTML='<h2>🎡 '+r+'</h2><p>'+(win?'You Won ₹'+win:'Try Again')+'</p>'+(win?'<button class="btn" style="background:green" onclick="addMoney('+win+',\'Spin\')">GET ₹'+win+'</button>':'<button class="btn" onclick="playSpin()">AGAIN</button>'); openM();}
function playScratch(){document.getElementById("mContent").innerHTML='<h3>Scratch</h3><div onclick="addMoney(3,\'Scratch\')" style="background:silver;padding:40px;border-radius:10px;">TAP TO SCRATCH</div>'; openM();}
function playGuess(){let n=Math.floor(Math.random()*10)+1; document.getElementById("mContent").innerHTML='<h3>Guess 1-10</h3><input type="number" id="gn" placeholder="1-10"><br><button class="btn" onclick="if(document.getElementById(\'gn\').value=='+n+'){addMoney(4,\'Guess\')}else{alert(\'Wrong! Was '+n+'\'); closeM();}">CHECK</button>'; openM();}
function playTap(){document.getElementById("mContent").innerHTML='<h3>Tap 5 Sec</h3><h1 id="tc">0</h1><button class="btn" id="tb" style="padding:30px 50px">TAP ME</button>'; openM(); let c=0; let b=document.getElementById("tb"); b.onclick=function(){c++;document.getElementById("tc").innerText=c;}; setTimeout(function(){b.disabled=true; if(c>20){addMoney(2,'Tap')}else{alert(c+' taps only, need 20'); closeM();}},5000);}
