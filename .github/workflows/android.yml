name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android Project
        run: |
          mkdir -p app/src/main
          echo "Creating wrapper..."
          curl -L https://github.com/pajjuaski3-lab/my-earning-app/archive/main.zip -o app.zip || true
          ls -la

      - name: Build Debug APK with WebView
        run: |
          mkdir -p MyApp/app/src/main/java/com/myearning/app
          mkdir -p MyApp/app/src/main/res/layout
          cat > MyApp/app/src/main/java/com/myearning/app/MainActivity.java << 'EOF'
          package com.myearning.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            WebView webView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              webView = new WebView(this);
              webView.getSettings().setJavaScriptEnabled(true);
              webView.setWebViewClient(new WebViewClient());
              webView.loadUrl("https://myearningapp2025.blogspot.com");
              setContentView(webView);
            }
            @Override
            public void onBackPressed() {
              if(webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }
          }
          EOF
          echo "Code created"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: my-app-code
          path: MyApp/